<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195" role="img" aria-label="Most used languages: TypeScript 48.1%, Dart 37.9%, JavaScript 7.4%, Python 2.7%, Java 2.6%, C# 1.2%">
