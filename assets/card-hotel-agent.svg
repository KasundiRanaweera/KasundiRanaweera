<svg xmlns="http://www.w3.org/2000/svg" width="580" height="282" viewBox="0 0 580 282" role="img" aria-label="Hotel AI Agent — Chat-based front-desk assistant that registers, finds, edits and removes guests through LLM tool calling — and asks for missing details instead of guessing.">
<title>Hotel AI Agent — Chat-based front-desk assistant that registers, finds, edits and removes guests through LLM tool calling — and asks for missing details instead of guessing.</title>
<style>
.in { animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.sweep { animation: sweep 7s ease-in-out 1s infinite; }
@keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 35%, 100% { transform: translateX(760px) skewX(-20deg); } }
.glow { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: scale(1.25); opacity: .6; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}</style>

<defs>
  <clipPath id="c"><rect width="580" height="282" rx="22"/></clipPath>
  <radialGradient id="g"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="1" stop-color="#060a17"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#818cf8" stop-opacity=".55"/></linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#22d3ee"/><stop offset="1.00" stop-color="#7dd3fc"/></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="580" height="282" fill="url(#bg)"/>
  <circle class="glow" cx="540" cy="30" r="190" fill="url(#g)"/>
  <rect class="sweep" x="0" y="-40" width="160" height="362" fill="url(#s)"/>
  <text x="552" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" fill="#22d3ee" fill-opacity=".1" text-anchor="end">03</text>
</g>
<rect x="1" y="1" width="578" height="280" rx="21" fill="none" stroke="url(#b)" stroke-width="1.5"/>
<g class="in">
  <rect x="32" y="26" width="54" height="54" rx="16" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".4"/>
  <text x="59" y="63" font-size="26" text-anchor="middle">🏨</text>
  <text x="104" y="53" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" fill="#eef4ff">Hotel AI Agent</text>
  <text x="105" y="76" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#22d3ee">llm · tool calling</text>
</g>
<g class="in" style="animation-delay:.12s"><text x="32" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a9b8d6">Chat-based front-desk assistant that registers, finds,</text><text x="32" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a9b8d6">edits and removes guests through LLM tool calling — and</text><text x="32" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a9b8d6">asks for missing details instead of guessing.</text></g>
<g class="in" style="animation-delay:.24s"><rect x="32" y="184" width="63" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/><text x="64" y="203" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#eef4ff" text-anchor="middle">Python</text><rect x="103.0" y="184" width="82" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/><text x="144" y="203" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#eef4ff" text-anchor="middle">Llama 3.1</text><rect x="193.5" y="184" width="50" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/><text x="218" y="203" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#eef4ff" text-anchor="middle">Groq</text><rect x="251.5" y="184" width="63" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/><text x="283" y="203" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#eef4ff" text-anchor="middle">SQLite</text><rect x="322.5" y="184" width="63" height="28" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".35"/><text x="354" y="203" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#eef4ff" text-anchor="middle">Gradio</text></g>
<g class="in" style="animation-delay:.36s"><rect x="32" y="228" width="128" height="30" rx="15" fill="none" stroke="#22d3ee"/><text x="96" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">VIEW CODE ↗</text></g>

