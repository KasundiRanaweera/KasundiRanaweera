<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kasundi Ranaweera — Full-Stack Developer, Computer Science undergraduate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1424"/>
      <stop offset="55%" stop-color="#2a1830"/>
      <stop offset="100%" stop-color="#3b1d34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#ff8fb8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8fb8" stop-opacity="0"/>
    </radialGradient>
    <g id="petal">
      <path d="M0,-9 C6,-9 9,-3 0,9 C-9,-3 -6,-9 0,-9 Z" fill="#ffb3cf"/>
    </g>
    <g id="flower">
      <use href="#petal" transform="rotate(0)   translate(0,-9)"/>
      <use href="#petal" transform="rotate(72)  translate(0,-9)"/>
      <use href="#petal" transform="rotate(144) translate(0,-9)"/>
      <use href="#petal" transform="rotate(216) translate(0,-9)"/>
      <use href="#petal" transform="rotate(288) translate(0,-9)"/>
      <circle r="5" fill="#ffe08a"/>
    </g>
    <style>
      .name  { font: 700 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff5f9; letter-spacing: 0.5px; }
      .hello { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffb3cf; letter-spacing: 3px; }
      .role  { font: 500 26px 'Consolas', 'Menlo', monospace; fill: #f3d6e3; opacity: 0; }
      .tag   { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #c9a9bb; }
      .caret { fill: #ff8fb8; animation: blink 1s steps(1) infinite; }

      .fade-up { opacity: 0; animation: up .9s ease-out forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .9s; }

      .r1 { animation: cycle 12s infinite 0s; }
      .r2 { animation: cycle 12s infinite 3s; }
      .r3 { animation: cycle 12s infinite 6s; }
      .r4 { animation: cycle 12s infinite 9s; }

      .spin  { animation: spin 18s linear infinite; transform-box: fill-box; transform-origin: center; }
      .float { animation: float 6s ease-in-out infinite; }
      .float2{ animation: float 7.5s ease-in-out infinite 1.2s; }
      .float3{ animation: float 5.5s ease-in-out infinite .6s; }

      .fall1 { animation: fall 9s linear infinite; }
      .fall2 { animation: fall 11s linear infinite 3s; }
      .fall3 { animation: fall 13s linear infinite 6s; }
      .fall1, .fall2, .fall3 { animation-fill-mode: backwards; }

      @keyframes up    { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 22% { opacity: 1; } 26% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes spin  { to { transform: rotate(360deg); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes fall  { 0% { transform: translate(0,-40px) rotate(0); opacity: 0; } 10% { opacity: .8; } 90% { opacity: .8; } 100% { transform: translate(-90px,380px) rotate(300deg); opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .fade-up, .r1 { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- falling petals -->
  <g opacity=".9">
    <g class="fall1"><use href="#petal" transform="translate(760,0) scale(.9)"/></g>
    <g class="fall2"><use href="#petal" transform="translate(1010,0) scale(.7)"/></g>
    <g class="fall3"><use href="#petal" transform="translate(620,0) scale(.6)"/></g>
  </g>

  <!-- blooms on the right -->
  <g class="float"><g transform="translate(980,150) scale(2.6)"><g class="spin"><use href="#flower"/></g></g></g>
  <g class="float2"><g transform="translate(1100,80) scale(1.4)"><g class="spin"><use href="#flower"/></g></g></g>
  <g class="float3"><g transform="translate(1080,250) scale(1.1)"><g class="spin"><use href="#flower"/></g></g></g>

  <!-- code-ish bracket motif -->
  <text x="790" y="292" class="tag" opacity=".55">&lt;/&gt; creating · learning · growing</text>

  <!-- text block -->
  <text x="70" y="92"  class="hello fade-up d1">HI THERE, I'M</text>
  <text x="70" y="160" class="name  fade-up d2">Kasundi Ranaweera</text>

  <g class="fade-up d3">
    <text x="70" y="215" class="role r1">&gt; full-stack developer</text>
    <text x="70" y="215" class="role r2">&gt; building AI agents with LLMs</text>
    <text x="70" y="215" class="role r3">&gt; data &amp; machine learning explorer</text>
    <text x="70" y="215" class="role r4">&gt; CS undergrad · NSBM × Plymouth</text>
    <rect x="70" y="232" width="14" height="3" class="caret"/>
    <text x="70" y="272" class="tag">Based in Sri Lanka · open to on-site / hybrid internships</text>
  </g>
</svg>
