<svg xmlns="http://www.w3.org/2000/svg" width="580" height="282" viewBox="0 0 580 282" role="img" aria-label="My First AI Agent — A personal assistant that understands requests, picks the right tool and acts — built from scratch in Python on a local Llama 3.1 model.">
<title>My First AI Agent — A personal assistant that understands requests, picks the right tool and acts — built from scratch in Python on a local Llama 3.1 model.</title>
<style>
.in { animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.sweep { animation: sweep 7s ease-in-out 1s infinite; }
@keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 35%, 100% { transform: translateX(760px) skewX(-20deg); } }
.glow { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: scale(1.25); opacity: .6; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}</style>

<defs>
  <clipPath id="c"><rect width="580" height="282" rx="22"/></clipPath>
  <radialGradient id="g"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1226"/><stop offset="1" stop-color="#060a17"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".9"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".12"/><stop offset="1" stop-color="#818cf8" stop-opacity=".55"/></linearGradient>
  <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#38bdf8"/><stop offset="1.00" stop-color="#7dd3fc"/></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
