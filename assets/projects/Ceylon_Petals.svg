<svg xmlns="http://www.w3.org/2000/svg" width="580" height="282" viewBox="0 0 580 282" role="img" aria-label="Ceylon Petals — A complete online flower shop with an AI chat assistant. Customers browse bouquets, hampers and plants, pay by card (PayHere), cash on delivery or WhatsApp, and track…">
<title>Ceylon Petals — A complete online flower shop with an AI chat assistant. Customers browse bouquets, hampers and plants, pay by card (PayHere), cash on delivery or WhatsApp, and track…</title>
<style>
.in { animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.sweep { animation: sweep 7s ease-in-out 1s infinite; }
@keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 35%, 100% { transform: translateX(760px) skewX(-20deg); } }
.glow { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: scale(1.25); opacity: .6; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { opacity: .8; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}</style>

<defs>
